<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body bgcolor="#100802" text="#FFFFFF" link="#777777" vlink="#777777"><center><br/><br/>
<script>
    var sw = screen.width - 15;
    var sh = screen.height - 250;
    var cx = sw / 2;
    var cy = sh / 2;
    var pro = screen.width/screen.height;
    if(pro>1){
    	// Landscape
        var f=sh;
    }
    else{
    	// Portrait
        var f=sw;
    }
</script>
<div class="content"><div class="graphic">
<script type="application/processing">
int n=sw;		//screen width
int m=sh;		//screen height
int i=0;
int j=0;
int r=random(0,100);
int g=random(0,100);
int b=random(0,255);
int s=20;

void setup()
{
	size(n,m);
	background(16,8,2);
	strokeWeight(1);
}

void draw()
{
	r=r+random(-20,20);
	if(r>255){r=255;}
	if(r<0){r=0;}
	g=g+random(-20,20);
	if(g>255){g=255;}
	if(g<0){g=0;}
	//b=b+random(-5,5);
	if(i==n){i=1;}
	fill(r,g,b);
	//stroke(r,g,b);
	rect(i*100,j*100,100,100);
	i=i+1;
	if(i>=14){j=j+1;i=0;}
	if(j>=8){j=0;}
}

</script>

<canvas style="image-rendering: -moz-crisp-edges ! important;" id="__processing0" tabindex="0" width=sw height=sh ></canvas>
</div></div></center>
<script src="processing.js" type="text/javascript"></script>
